version: '3.8'

services:
  simulator:
    build: .
    container_name: mqtt-simulator-ups
    env_file:
      - .env
    ports:
      - "4409:4409"
    environment:
      - TZ=Asia/Jakarta
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
